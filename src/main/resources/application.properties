server.port=${SERVER_PORT:8080}

# ===== 上游 REST 调用与容错层配置（前缀 resilience）=====

# 上游基础地址（真实部署时指向外部支付服务；测试中被本机随机端口桩覆盖）
resilience.upstream.base-url=${UPSTREAM_BASE_URL:http://localhost:9000}
# 建立 TCP 连接超时
resilience.upstream.connect-timeout-ms=${UPSTREAM_CONNECT_TIMEOUT_MS:1000}
# 单次请求读超时
resilience.upstream.request-timeout-ms=${UPSTREAM_REQUEST_TIMEOUT_MS:2000}

# 重试：仅对可安全重试的失败（超时 / 408 / 429 / 5xx / 连接类 IO）生效
# 总尝试次数（含首次）
resilience.retry.max-attempts=${RETRY_MAX_ATTEMPTS:3}
# 首次重试前的基础退避
resilience.retry.initial-backoff-ms=${RETRY_INITIAL_BACKOFF_MS:100}
# 退避倍数
resilience.retry.backoff-multiplier=${RETRY_BACKOFF_MULTIPLIER:2.0}
# 退避上限
resilience.retry.max-backoff-ms=${RETRY_MAX_BACKOFF_MS:1000}
# 随机抖动比例（0~1），用于打散并发重试
resilience.retry.jitter-ratio=${RETRY_JITTER_RATIO:0.2}

# 熔断：连续失败次数达到阈值后 OPEN
resilience.circuit-breaker.failure-threshold=${CB_FAILURE_THRESHOLD:5}
# OPEN 持续时间，之后进入 HALF_OPEN 放行一个试探请求
resilience.circuit-breaker.open-state-duration-ms=${CB_OPEN_STATE_DURATION_MS:10000}

# 幂等存储
# 终态记录保留时长
resilience.idempotency.ttl-millis=${IDEMPOTENCY_TTL_MILLIS:86400000}
# 最大条目数，超出后优先淘汰最老终态记录
resilience.idempotency.max-entries=${IDEMPOTENCY_MAX_ENTRIES:10000}
# 并发重复提交等待首个请求终态的最长时间，超时返回 IDEMPOTENCY_IN_FLIGHT
resilience.idempotency.wait-timeout-ms=${IDEMPOTENCY_WAIT_TIMEOUT_MS:10000}
